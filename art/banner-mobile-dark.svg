<svg xmlns="http://www.w3.org/2000/svg" width="392" height="408" viewBox="0 0 392 408"><style>@keyframes swim-a{0%{transform:translate(-14px,0) scaleX(1)}23%{transform:translate(40px,5px) scaleX(1)}46%{transform:translate(94px,-3px) scaleX(1)}50%{transform:translate(94px,-3px) scaleX(-1)}73%{transform:translate(40px,4px) scaleX(-1)}96%{transform:translate(-14px,0) scaleX(-1)}}@keyframes swim-b{0%{transform:translate(44px,0) scaleX(1)}4%{transform:translate(44px,0) scaleX(-1)}27%{transform:translate(-14px,-6px) scaleX(-1)}50%{transform:translate(-72px,-2px) scaleX(-1)}54%{transform:translate(-72px,-2px) scaleX(1)}77%{transform:translate(-14px,4px) scaleX(1)}}@keyframes swim-c{0%{transform:translate(20px,0) scaleX(1)}4%{transform:translate(20px,0) scaleX(-1)}50%{transform:translate(-102px,8px) scaleX(-1)}54%{transform:translate(-102px,8px) scaleX(1)}}@keyframes rise{0%{transform:translate(0,0);opacity:0}15%,85%{opacity:.9}50%{transform:translate(2px,-26px)}}@keyframes twinkle{0%{opacity:.25}}.fish{transform-box:fill-box;transform-origin:center}.fish-a{animation:swim-a 10.5s ease-in-out infinite}.fish-b{animation:swim-b 8.25s ease-in-out -3s infinite}.fish-c{animation:swim-c 6.75s ease-in-out -4.5s infinite}.bubble{animation:rise 4s ease-in infinite}.bubble-b{animation-delay:-1.3s}.bubble-c{animation-delay:-2.6s}.star{animation:twinkle 3s ease-in-out infinite alternate}.star-b{animation-delay:-1.5s}@media (prefers-reduced-motion:reduce){.bubble,.fish,.star{animation:none}}</style><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient></defs><rect width="392" height="408" x="0" y="0" fill="url(#bg)" rx="16"/><g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="20" y="72" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="700" letter-spacing="-.5">Fire TV Toolkit</text><text x="20" y="101" fill="#a8a29