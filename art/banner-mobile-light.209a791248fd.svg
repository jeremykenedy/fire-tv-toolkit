<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 408" width="392" height="408" role="img" aria-label="Fire TV Toolkit">
  <style>.fish,.bubble,.star{transform-box:fill-box;transform-origin:center}.fish-a{animation:swim-a 10.5s ease-in-out infinite}.fish-b{animation:swim-b 8.25s ease-in-out -3s infinite}.fish-c{animation:swim-c 6.75s ease-in-out -4.5s infinite}.bubble{animation:rise 3s ease-in infinite}.bubble-b{animation-delay:-0.975s}.bubble-c{animation-delay:-1.95s}.star{animation:twinkle 2.25s ease-in-out infinite alternate}.star-b{animation-delay:-1.125s}@keyframes swim-a{0%{transform:translate(-14px,0) scaleX(1)}23%{transform:translate(40px,5px) scaleX(1)}46%{transform:translate(94px,-3px) scaleX(1)}50%{transform:translate(94px,-3px) scaleX(-1)}73%{transform:translate(40px,4px) scaleX(-1)}96%{transform:translate(-14px,0) scaleX(-1)}to{transform:translate(-14px,0) scaleX(1)}}@keyframes swim-b{0%{transform:translate(44px,0) scaleX(1)}4%{transform:translate(44px,0) scaleX(-1)}27%{transform:translate(-14px,-6px) scaleX(-1)}50%{transform:translate(-72px,-2px) scaleX(-1)}54%{transform:translate(-72px,-2px) scaleX(1)}77%{transform:translate(-14px,4px) scaleX(1)}to{transform:translate(44px,0) scaleX(1)}}@keyframes swim-c{0%{transform:translate(20px,0) scaleX(1)}4%{transform:translate(20px,0) scaleX(-1)}50%{transform:translate(-102px,8px) scaleX(-1)}54%{transform:translate(-102px,8px) scaleX(1)}to{transform:translate(20px,0) scaleX(1)}}@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}50%{transform:translate(2px,-26px)}85%{opacity:.9}to{transform:translate(0,-50px);opacity:0}}@keyframes twinkle{0%{opacity:.25}to{opacity:1}}@media (prefers-reduced-motion:reduce){.fish,.bubble,.star{animation:none}}</style>
  <rect width="392" height="408" fill="#fff" stroke="#e5e7eb" rx="16" />
  <text x="20" y="76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" fill="#0f172a" font-weight="700" letter-spacing="-.5">Fire TV Toolkit</text>
  <text x="20" y="104" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#64748b">Ad-free screensavers, a better home screen,</text>
  <text x="20" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#64748b">and the Alexa deep-sleep fix.</text>
  <rect width="65" height="22" x="20" y="140" fill="#f5f3ff" stroke="#8b5cf6" stroke-width=".8" rx="11" />
  <text x="52.5" y="154" fill="#6d28d9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">Alexa Fix</text>
  <rect width="118" height="22" x="93" y="140" fill="#eff6ff" stroke="#3b82f6" stroke-width=".8" rx="11" />
  <text x="152.0" y="154" fill="#1e40af" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">Ad-Free Screensavers</text>
  <rect width="100" height="22" x="219" y="140" fill="#f0fdf4" stroke="#22c55e" stroke-width=".8" rx="11" />
  <text x="269.0" y="154" fill="#166534" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">AT4K or LTV Home</text>
  <rect width="86" height="22" x="20" y="170" fill="#fffbeb" stroke="#f59e0b" stroke-width=".8" rx="11" />
  <text x="63.0" y="184" fill="#b45309" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">On-TV Picker</text>
  <rect width="80" height="22" x="114" y="170" fill="#fef2f2" stroke="#ef4444" stroke-width=".8" rx="11" />
  <text x="154.0" y="184" fill="#b91c1c" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">No Tracking</text>
  <g transform="translate(89.75,244) scale(1.25)">
    <rect width="170" height="112" fill="none" stroke="#6d28d9" stroke-width="3" rx="10" />
    <rect width="146" height="88" x="12" y="12" fill="#eff6ff" rx="4" />
    <rect width="146" height="56" x="12" y="32" fill="#bfdbfe" />
    <rect width="146" height="12" x="12" y="88" fill="#fde68a" />
    <g fill="#fff" stroke="#60a5fa" stroke-width=".8">
      <circle class="bubble" cx="30" cy="84" r="1.8" />
      <circle class="bubble bubble-b" cx="74" cy="86" r="1.4" />
      <circle class="bubble bubble-c" cx="142" cy="85" r="2.2" />
    </g>
    <g class="fish fish-a">
      <ellipse cx="48" cy="52" fill="#f97316" rx="10" ry="6" />
      <path fill="#f97316" d="M38.0 52 l-7.0 -5.0 v10.0 z" />
    </g>
    <g class="fish fish-b">
      <ellipse cx="102" cy="66" fill="#3b82f6" rx="8" ry="4.8" />
      <path fill="#3b82f6" d="M94.0 66 l-5.6 -4.0 v8.0 z" />
    </g>
    <g class="fish fish-c">
      <ellipse cx="128" cy="46" fill="#22c55e" rx="6" ry="3.6" />
      <path fill="#22c55e" d="M122.0 46 l-4.2 -3.0 v6.0 z" />
    </g>
    <circle cx="24" cy="-6" r="13" fill="#f59e0b" />
    <circle cx="31" cy="-11" r="11" fill="#fff" />
    <circle class="star" cx="60" cy="-12" r="2.5" fill="#c4b5fd" />
    <circle class="star star-b" cx="150" cy="-8" r="2" fill="#c4b5fd" />
    <rect width="40" height="5" x="65" y="118" fill="#6d28d9" rx="2.5" />
  </g>
</svg>
