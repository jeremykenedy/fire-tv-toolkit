title: Fire TV Toolkit
description: Worldwide online IPTV and guided Fire TV tools, from your desktop or terminal.
theme: jekyll-theme-cayman
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
exclude:
  - node_modules
  - desktop
  - android
  - bin
  - src
  - test
  - screensavers
  - coverage
  - lcov.info
  - package.json
  - package-lock.json
  - setup.js
  - sonar-project.properties
  - .github
