name: Desktop app

on:
  push:
    paths:
      [
        'desktop/**',
        'src/**',
        'package.json',
        'package-lock.json',
        '.github/workflows/desktop.yml',
      ]
  pull_request:
    paths:
      [
        'desktop/**',
        'src/**',
        'package.json',
        'package-lock.json',
        '.github/workflows/desktop.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: '--mac --x64 --arm64'
          - os: windows-latest
            targets: '--win --x64'
          - os: ubuntu-latest
            targets: '--linux --x64'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run lint
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run dist -- ${{ matrix.targets }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
